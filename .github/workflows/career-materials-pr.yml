name: Apply and validate career materials

on:
  push:
    branches:
      - agent/align-career-materials-evidence
    paths:
      - .career-materials.part0
      - .career-materials.part1
      - .github/workflows/career-materials-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-career-materials-evidence
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract reviewed career materials
        run: |
          cat .career-materials.part0 .career-materials.part1 \
            | base64 --decode > /tmp/career-materials.tar.xz
          tar -xJf /tmp/career-materials.tar.xz

      - name: Install dependencies
        run: npm ci

      - name: Run the full public build and quality gates
        run: npm run build:all

      - name: Commit source changes and remove one-off workflow
        run: |
          rm .career-materials.part0 .career-materials.part1
          rm .github/workflows/career-materials-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md presentations/work-timeline.html share/work-timeline-script.md
          git add -u .career-materials.part0 .career-materials.part1 .github/workflows/career-materials-pr.yml
          git commit -m "docs(career): align public robotics leadership evidence"
          git push origin HEAD:agent/align-career-materials-evidence
