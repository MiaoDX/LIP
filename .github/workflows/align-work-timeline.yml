name: Align work timeline review branch

on:
  push:
    branches:
      - agent/resume-timeline-positioning-20260901
    paths:
      - .github/workflows/align-work-timeline.yml

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[timeline-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/resume-timeline-positioning-20260901
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Align positioning and narrative labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('presentations/work-timeline.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('<title>面向具身智能：从模型到真机的可交付系统</title>', '<title>机器人系统技术负责人：建设可交付、可迭代的机器人系统</title>'),
              ('<meta name="description" content="MiaoDX 工作 Timeline：以系统工程提升机器人交付效率和稳定性，以数据与评测驱动模型和系统持续迭代">', '<meta name="description" content="MiaoDX 工作 Timeline：以机器人系统技术负责人为主定位，以系统工程支撑稳定交付，以数据评测、模型后训练与真机适配驱动持续迭代">'),
              ('WORK TIMELINE · 2019—2026 · ROBOTICS SYSTEMS / EMBODIED AI', 'WORK TIMELINE · THREE CAREER ERAS · 2019—2026'),
              ('MiaoDX · HANDS-ON SYSTEMS LEAD ·', 'MiaoDX · ROBOTICS SYSTEMS TECHNICAL LEAD · HANDS-ON ·'),
              ('aria-label="三个阶段"', 'aria-label="三个职业时代"'),
              ('<div class="year">2019—2025 H1</div><strong>自动驾驶</strong>', '<div class="year">2019—2025.03</div><strong>自动驾驶</strong>'),
              ('<div class="year">2025</div><strong>机器人系统交付</strong>', '<div class="year">2025.03—2025 H2</div><strong>机器人系统交付</strong>'),
              ('<div class="year">2026 → NOW</div><strong>模型到真机</strong><span>微调与适配 → 受控执行 → 机器验收</span>', '<div class="year">2026 → NOW</div><strong>模型后训练与真机</strong><span>微调与适配 → 受控执行 → 机器验收</span>'),
              ('开场先给长期定位，不强调身份型标签。默认根据岗位选择负责人版或 hands-on 版路线，三到八分钟均可结束并转入岗位讨论。', '开场先给主定位：机器人系统技术负责人 / hands-on technical lead。首页是三个职业时代，后续根据岗位选择负责人、hands-on 或数据评测路线。'),
              ('THE MAP · ROLE & SYSTEM EVOLUTION', 'THE MAP · FOUR SCOPE EXPANSIONS'),
              ('岗位在变，两条工作主线没有变', '岗位在变，责任持续扩大，方法没有变'),
              ('<time>2025</time><h3>从新领域切入机器人系统交付</h3>', '<time>2025.03—2025 H2</time><h3>从新领域切入机器人系统交付</h3>'),
              ('<time>2026 → NOW</time><h3>把公开模型能力带进自有真机任务</h3>', '<time>2026 → NOW</time><h3>把模型后训练、执行与验收接到真机</h3>'),
              ('<span>模型、执行、验收三层闭环</span>', '<span>模型后训练、执行、验收三层闭环</span>'),
              ('负责人岗位默认从本页进入团队建设页；hands-on 或 Staff 岗位默认进入机器人交付与模型到真机页。', '本页是四次责任扩展，与首页的三个职业时代属于不同阅读层次。负责人岗位进入团队建设页；hands-on、Staff 或数据评测岗位进入对应的机器人案例页。'),
              ('<h2>模型、执行、验收：从公开能力到真机闭环</h2><p class="lead">数据适配与微调形成模型能力，受控执行接入机器人，机器验收给出可追溯证据</p>', '<h2>模型后训练、受控执行与机器验收</h2><p class="lead">数据适配与微调形成任务能力，受控执行接入机器人，机器验收给出可追溯证据</p>'),
              ('<div class="step">01 · MODEL</div><h3>把上游能力带到自有场景</h3>', '<div class="step">01 · MODEL ADAPTATION</div><h3>把上游模型能力带到自有场景</h3>'),
              ('<li>完成两组具体任务的微调与训练工程优化</li>', '<li>完成两组具体任务的模型后训练、微调与训练工程优化</li>'),
              ('<strong>限定范围抓取成功率 &gt;90%</strong>', '<strong>限定任务集动作成功率 &gt;90%</strong>'),
              ('<div class="positioning"><div class="position-main"><b>NEXT · TWO DIRECTIONS</b><strong>机器人系统工程 / 数据与评测</strong><span>不限定单个 JD · 深入一线技术 · 从问题定义跟到真机验证和交付</span></div></div>', '<div class="positioning"><div class="position-main"><b>PRIMARY · ROBOTICS SYSTEMS TECHNICAL LEAD</b><strong>机器人系统技术负责人 / Hands-on Technical Lead</strong><span>系统工程与稳定交付为主线 · 数据与评测、模型后训练与真机适配为技术纵深</span></div></div>'),
              ('DISCUSS · SYSTEM ENGINEERING / DATA + EVAL / TEAM BUILDING', 'DISCUSS · SYSTEM ENGINEERING / DATA + EVAL / MODEL POST-TRAINING / TEAM BUILDING'),
              ('收尾说明这次主要看机器人系统工程和数据评测两类机会，不要求对方当场给出明确任务或固定 JD。进入讨论时先理解团队当前的问题类型、协作方式和任务形成方式，再选择一条主线深入。', '收尾明确机器人系统技术负责人 / hands-on technical lead 是主方向；数据与评测、模型后训练、微调和真机适配是能力纵深。进入讨论时先理解团队当前的问题类型、协作方式和任务形成方式，再选择最相关案例深入。'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]}')
              text = text.replace(old, new)

          if text.count('data-index="') != 9:
              raise SystemExit('work timeline must contain exactly nine slides')
          required = [
              'THREE CAREER ERAS',
              'FOUR SCOPE EXPANSIONS',
              '模型后训练、受控执行与机器验收',
              'PRIMARY · ROBOTICS SYSTEMS TECHNICAL LEAD',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and validate
        run: |
          npm ci
          npm run build:all
          test -f .vitepress/dist/share/work-timeline.html
          test "$(grep -o 'data-index="[0-9][0-9]"' presentations/work-timeline.html | wc -l)" = "9"

      - name: Commit final deck and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/align-work-timeline.yml
          git add presentations/work-timeline.html
          git commit -m "docs: clarify work timeline positioning [timeline-aligned]"
          git push origin HEAD:agent/resume-timeline-positioning-20260901
