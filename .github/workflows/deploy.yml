name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Build VitePress docs
      - run: npm run docs:build

      # 2. Copy standalone HTML presentations + assets that VitePress does not transform.
      # Canonical sources:
      # - presentations/*.{html,png,jpg,jpeg,svg,webp,gif}
      # - presentations/<asset-folder>/
      # Published under /LIP/share/
      - name: Copy standalone share presentations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vitepress/dist/share
          shopt -s nullglob
          cp presentations/*.{html,png,jpg,jpeg,svg,webp,gif} .vitepress/dist/share/ 2>/dev/null || true
          for dir in presentations/*/; do
            cp -R "$dir" ".vitepress/dist/share/$(basename "$dir")"
          done

      # 2.5 Copy standalone AI Coding pages that live with their source material.
      # Example: ai-coding/ultrathink-to-goal/index.html + images/
      # Published under /LIP/ai-coding/<slug>/
      - name: Copy standalone AI Coding pages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for page in ai-coding/*/index.html; do
            src_dir="$(dirname "$page")"
            slug="$(basename "$src_dir")"
            dest=".vitepress/dist/ai-coding/$slug"
            mkdir -p "$dest"
            cp "$page" "$dest/index.html"
            for asset_dir in images screenshots assets; do
              if [ -d "$src_dir/$asset_dir" ]; then
                cp -R "$src_dir/$asset_dir" "$dest/"
              fi
            done
          done

      # 2.6 Copy consult/ → output
      - run: mkdir -p .vitepress/dist/consult && cp public/consult/*.html .vitepress/dist/consult/ 2>/dev/null || true

      # 3. Build Marp slides → output to VitePress dist.
      # Scanner picks up every md file with `marp: true` in frontmatter
      # (see scripts/build-slides.mjs) and writes .html to
      # .vitepress/dist/slides/marp/<slug>.html. PDF generation is opt-in
      # via MARP_PDF=1 (skipped by default to keep CI fast + deterministic).
      - run: npm run marp:build

      # 4. Build Slidev slides → output to VitePress dist
      - run: npx slidev build slides/slides.md --base /LIP/slides/slidev/ --out ../../.vitepress/dist/slides/slidev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
