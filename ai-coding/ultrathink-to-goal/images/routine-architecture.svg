<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <style>
    .bg { fill: #f8f6f2; }
    .title { font-size: 25px; font-weight: 700; fill: #171717; }
    .subtitle { font-size: 14px; fill: #57534e; }
    .card { fill: #fffaf0; stroke: #d6c8b5; stroke-width: 1.4; }
    .cloud { fill: #eef6ff; stroke: #78a8d8; stroke-width: 1.5; }
    .evidence { fill: #f1f8f4; stroke: #80b48a; stroke-width: 1.5; }
    .handoff { fill: #fff3f1; stroke: #d18a7d; stroke-width: 1.5; }
    .tag { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; fill: #8a5a25; font-weight: 700; }
    .card-title { font-size: 17px; font-weight: 700; fill: #1f1f1f; }
    .copy { font-size: 12.5px; fill: #57534e; }
    .small { font-size: 11.5px; fill: #6b625a; }
    .arrow { fill: none; stroke: #9a8f83; stroke-width: 2; }
    .boundary { fill: #f4efe7; stroke: #c6b59f; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .boundary-title { font-size: 14px; font-weight: 700; fill: #3a332c; }
    .boundary-copy { font-size: 12px; fill: #5f574f; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a8f83"/>
    </marker>
  </defs>

  <rect width="920" height="560" rx="18" class="bg"/>

  <text x="460" y="48" text-anchor="middle" class="title">Claude Routine = saved harness configuration</text>
  <text x="460" y="72" text-anchor="middle" class="subtitle">prompt, repo, connectors, environment, trigger, and handoff protocol run as one cloud job</text>

  <rect x="42" y="128" width="150" height="112" rx="10" class="card"/>
  <text x="117" y="158" text-anchor="middle" class="tag">Trigger</text>
  <text x="117" y="188" text-anchor="middle" class="card-title">启动入口</text>
  <text x="117" y="214" text-anchor="middle" class="copy">schedule / API</text>
  <text x="117" y="232" text-anchor="middle" class="copy">GitHub events</text>

  <path d="M 192 184 L 238 184" class="arrow" marker-end="url(#arrow)"/>

  <rect x="240" y="112" width="170" height="144" rx="10" class="card"/>
  <text x="325" y="142" text-anchor="middle" class="tag">Package</text>
  <text x="325" y="172" text-anchor="middle" class="card-title">封装 harness</text>
  <text x="325" y="199" text-anchor="middle" class="copy">prompt + repo</text>
  <text x="325" y="218" text-anchor="middle" class="copy">connectors + env</text>
  <text x="325" y="237" text-anchor="middle" class="copy">固定职责和边界</text>

  <path d="M 410 184 L 456 184" class="arrow" marker-end="url(#arrow)"/>

  <rect x="458" y="102" width="178" height="164" rx="12" class="cloud"/>
  <text x="547" y="134" text-anchor="middle" class="tag">Cloud Run</text>
  <text x="547" y="165" text-anchor="middle" class="card-title">独立云端 session</text>
  <text x="547" y="195" text-anchor="middle" class="copy">clean context</text>
  <text x="547" y="215" text-anchor="middle" class="copy">managed infra</text>
  <text x="547" y="235" text-anchor="middle" class="copy">bounded runtime</text>

  <path d="M 636 184 L 682 184" class="arrow" marker-end="url(#arrow)"/>

  <rect x="684" y="112" width="174" height="144" rx="10" class="evidence"/>
  <text x="771" y="142" text-anchor="middle" class="tag">Evidence</text>
  <text x="771" y="172" text-anchor="middle" class="card-title">结果回传</text>
  <text x="771" y="199" text-anchor="middle" class="copy">label / comment</text>
  <text x="771" y="218" text-anchor="middle" class="copy">branch / PR</text>
  <text x="771" y="237" text-anchor="middle" class="copy">session transcript</text>

  <path d="M 771 256 C 771 324 673 336 586 336" class="arrow" marker-end="url(#arrow)"/>

  <rect x="298" y="304" width="288" height="100" rx="10" class="handoff"/>
  <text x="442" y="335" text-anchor="middle" class="tag">Handoff</text>
  <text x="442" y="365" text-anchor="middle" class="card-title">人 review，或切回本地重 harness</text>
  <text x="442" y="390" text-anchor="middle" class="copy">human judgment stays at the boundary</text>

  <rect x="82" y="444" width="756" height="72" rx="12" class="boundary"/>
  <text x="460" y="472" text-anchor="middle" class="boundary-title">60 分钟不是能力上限，而是任务-工具匹配边界</text>
  <text x="460" y="497" text-anchor="middle" class="boundary-copy">需要 GPU / 真机 / 本地 dataset，或者验证风险变高，就切回本地重 harness</text>
</svg>
