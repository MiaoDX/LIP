    <rect x="830" y="800" width="175" height="24" rx="12" fill="#e9e4f8"/><text x="917" y="816" text-anchor="middle" class="purple">openpi runtime</text>
    <rect x="1035" y="800" width="180" height="24" rx="12" fill="#e9e4f8"/><text x="1125" y="816" text-anchor="middle" class="purple">OpenWAM adapters</text>
