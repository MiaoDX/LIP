<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">具身智能技术演进河流 demo</title>
  <desc id="desc">用时间和问题转折展示项目如何从单任务策略流向 VLA 和 WAM，并在下方补充数据、控制、仿真和运行时支流。项目卡可以跨越多个阶段和能力层。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f2e8"/><stop offset="1" stop-color="#e9e0d2"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b36a20"/><stop offset=".48" stop-color="#167a74"/><stop offset="1" stop-color="#6656a8"/></linearGradient>
    <style>
      .sans{font-family:"IBM Plex Sans","Noto Sans SC",sans-serif}.serif{font-family:"Source Serif 4","Noto Serif SC",serif}.mono{font-family:"DM Mono","IBM Plex Mono",monospace}.ink{fill:#24353a}.muted{fill:#5b6c71}.dim{fill:#7e8d91}.gold{fill:#b36a20}.cyan{fill:#167a74}.purple{fill:#6656a8}.coral{fill:#b34e42}.card{fill:#fff;stroke:#bbc9c5}.grid{stroke:#d2dbd8;stroke-width:1}.small{font-size:14px}.label{font-size:16px;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="950" fill="url(#paper)"/>
  <rect x="42" y="36" width="1516" height="878" rx="20" fill="none" stroke="#c9d4d1"/>
  <text x="84" y="94" class="mono gold" font-size="13" letter-spacing="3">VIEW D / EVOLUTION RIVER</text>
  <text x="84" y="154" class="serif ink" font-size="54" font-weight="600">技术不是一条线，是几条河汇到动作</text>
  <text x="84" y="194" class="sans muted" font-size="19">沿时间看问题如何改变；项目可以跨河道，不必固定在单一栏目</text>

  <g class="mono dim" font-size="12"><text x="170" y="260">2012</text><text x="430" y="260">2018</text><text x="690" y="260">2021</text><text x="950" y="260">2023</text><text x="1210" y="260">2024</text><text x="1450" y="260">2026</text></g>
  <g class="grid"><path d="M170 280V800M430 280V800M690 280V800M950 280V800M1210 280V800M1450 280V800"/></g>
  <path d="M130 382 C420 360 590 440 810 410 S1190 330 1490 370" fill="none" stroke="url(#river)" stroke-width="34" opacity=".2"/>
  <path d="M130 580 C390 610 560 540 780 590 S1180 650 1490 560" fill="none" stroke="url(#river)" stroke-width="34" opacity=".16"/>
  <path d="M130 382 C420 360 590 440 810 410 S1190 330 1490 370" fill="none" stroke="url(#river)" stroke-width="3"/>
  <path d="M130 580 C390 610 560 540 780 590 S1180 650 1490 560" fill="none" stroke="url(#river)" stroke-width="3"/>

  <g class="sans muted small"><text x="88" y="372">控制 / 策略</text><text x="88" y="570">数据 / 世界</text></g>
  <g class="mono dim" font-size="11"><text x="128" y="332">能否重复学习</text><text x="438" y="332">能否覆盖任务</text><text x="704" y="332">能否共享本体</text><text x="950" y="332">能否落到动作</text><text x="1206" y="332">能否开放评测</text><text x="1420" y="332">能否扩展到世界</text></g>

  <a xlink:href="https://github.com/ARISE-Initiative/robomimic" target="_blank"><g transform="translate(245 342)"><rect width="180" height="64" rx="9" class="card"/><text x="14" y="27" class="sans ink label">robomimic</text><text x="14" y="47" class="mono dim" font-size="11">episode + BC</text></g></a>
