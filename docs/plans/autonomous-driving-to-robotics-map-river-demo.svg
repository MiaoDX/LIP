  <g class="mono dim" font-size="11"><text x="1260" y="754">颜色 = 能力支流</text><text x="1260" y="784">入口 = 点击项目卡</text><text x="1260" y="814">等级 = 回到证据台账核对</text></g>
  <text x="84" y="884" class="mono dim" font-size="12">读法 · 主河流回答“为什么演进” · 支流回答“依赖哪些能力” · 节点链接回论文、仓库和证据台账</text>
