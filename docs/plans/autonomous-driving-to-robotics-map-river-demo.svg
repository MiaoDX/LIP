    <rect x="630" y="770" width="160" height="24" rx="12" fill="#f4e4cf"/><text x="710" y="786" text-anchor="middle" class="gold">TinyMPC</text>
    <rect x="820" y="770" width="180" height="24" rx="12" fill="#f4e4cf"/><text x="910" y="786" text-anchor="middle" class="gold">action horizon</text>
