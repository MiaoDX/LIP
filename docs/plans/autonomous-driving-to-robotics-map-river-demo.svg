  <a xlink:href="https://openvla.github.io/" target="_blank"><g transform="translate(1150 300)"><rect width="190" height="64" rx="9" class="card"/><text x="14" y="27" class="sans ink label">OpenVLA</text><text x="14" y="47" class="mono dim" font-size="11">open checkpoint</text></g></a>
  <a xlink:href="https://github.com/Physical-Intelligence/openpi" target="_blank"><g transform="translate(1180 500)"><rect width="180" height="64" rx="9" class="card"/><text x="14" y="27" class="sans ink label">π0 / openpi</text><text x="14" y="47" class="mono dim" font-size="11">flow action</text></g></a>
  <a xlink:href="https://github.com/OpenWAM-Official/OpenWAM" target="_blank"><g transform="translate(1390 420)"><rect width="160" height="64" rx="9" class="card"/><text x="14" y="27" class="sans ink label">OpenWAM</text><text x="14" y="47" class="mono dim" font-size="11">world action</text></g></a>

